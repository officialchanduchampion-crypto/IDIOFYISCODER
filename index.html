    function render(){
      const route=getRoute();let content="";
      const authOnly=["dashboard","profile","my-competitions","arena","submissions","certificates","achievements","notifications","settings"];
      if((authOnly.includes(route)||route.startsWith("arena/"))&&!currentUser())content=`<section class="page"><div class="wrap">${pageTitle("STUDENT WORKSPACE","Sign in to continue","This section is part of your personal coding workspace.",`<button class="button primary" data-route="login">Sign in</button>`)}</div></section>`;
      else if(route==="home")content=homePage();
      else if(route==="competitions")content=competitionsPage();
      else if(route.startsWith("competition/"))content=competitionPage(route.split("/")[1]);
      else if(route==="leaderboard")content=leaderboardPage();
      else if(route==="students")content=studentsPage();
      else if(route.startsWith("student/"))content=profilePage(route.split("/")[1]);
      else if(route==="about")content=aboutPage();
      else if(route==="faq")content=faqPage();
      else if(route==="contact")content=contactPage();
      else if(["login","register","forgot"].includes(route))content=authPage(route);
      else if(route==="verify")content=verifyPage();
      else if(route==="dashboard")content=workspace(route,dashboardPage());
      else if(route==="profile")content=workspace(route,profilePage(currentUser()?.username));
      else if(route==="my-competitions")content=workspace(route,myCompetitionsPage());
      else if(route==="arena"||route.startsWith("arena/"))content=workspace("arena",arenaPage(route.split("/")[1]));
      else if(route.startsWith("problem/"))content=workspace("arena",problemPage(route.split("/")[1]));
      else if(route==="submissions")content=workspace(route,submissionsPage());
      else if(route==="certificates")content=workspace(route,certificatesPage());
      else if(route==="achievements")content=workspace(route,achievementsPage());
      else if(route==="notifications")content=workspace(route,notificationsPage());
      else if(route==="settings")content=workspace(route,settingsPage());
      else if(route==="admin"||route.startsWith("admin/")){if(currentUser()?.role!=="admin"){content=`<section class="page"><div class="wrap">${pageTitle("RESTRICTED AREA","Admin access required","Sign in with the demo admin account to continue.",`<button class="button primary" data-route="login">Go to sign in</button>`)}</div></section>`}else content=workspace(route,adminPage(route))}
      else content=`<section class="page"><div class="wrap">${pageTitle("404 · NOT FOUND","Oops! This problem doesn't exist.","That route is not part of the demo. Return to the platform home.",`<button class="button primary" data-route="home">Go home</button>`)}</div></section>`;
      const wRoute=route.startsWith("competition/")||route.startsWith("student/")||route==="home"||route==="competitions"||route==="leaderboard"||route==="students"||route==="about"||route==="faq"||route==="contact"||["login","register","forgot","verify"].includes(route);
      document.querySelector("#app").innerHTML=header(route)+`<main id="main" tabindex="-1">${content}</main>`+(wRoute?footer():"");
      document.body.dataset.theme=data.theme||"dark";
      if(route==="login")document.querySelector("#login-form .demo-notice")?.insertAdjacentHTML("beforebegin",`<div class="row" style="margin:0 0 14px"><button class="button secondary" style="flex:1" data-action="demo-social">Continue with Google · demo</button><button class="button secondary" style="flex:1" data-action="demo-social">Continue with GitHub · demo</button></div><div class="micro" style="margin:-7px 0 12px">Social sign-in is not connected in this standalone demo.</div>`);
      if(route==="competitions"){document.querySelector("#difficulty-filter")?.insertAdjacentHTML("afterend",`<select class="select" id="country-comp-filter" aria-label="Filter by country"><option value="">All countries</option>${countries.map(c=>`<option ${appState.compCountry===c?"selected":""}>${c}</option>`).join("")}</select><select class="select" id="duration-filter" aria-label="Filter by duration"><option value="">Any duration</option><option value="short" ${appState.compDuration==="short"?"selected":""}>Under 90 min</option><option value="medium" ${appState.compDuration==="medium"?"selected":""}>90–150 min</option><option value="long" ${appState.compDuration==="long"?"selected":""}>Over 150 min</option></select><select class="select" id="prize-filter" aria-label="Filter by prize"><option value="">All prizes</option><option value="cash" ${appState.compPrize==="cash"?"selected":""}>Cash prize</option><option value="other" ${appState.compPrize==="other"?"selected":""}>Scholarship / other</option></select><select class="select" id="date-filter" aria-label="Filter by date"><option value="">Any date</option><option value="soon" ${appState.compDate==="soon"?"selected":""}>Within 30 days</option><option value="later" ${appState.compDate==="later"?"selected":""}>More than 30 days</option></select>`)}
      if(route==="leaderboard"){
        document.querySelectorAll(".tabs .tab").forEach(tab=>{tab.dataset.action="rank-tab";tab.dataset.value=tab.textContent.trim();tab.classList.toggle("active",tab.dataset.value===appState.rankTab)});
        const board=document.querySelector("#leader-table");if(board)board.innerHTML=leaderboardView();
      }
      const top=document.querySelector("#topbar");if(top)top.classList.toggle("scrolled",window.scrollY>8);
      if(route.startsWith("arena")){const p=getProblem(route.split("/")[1]||data.lastProblem);data.lastProblem=p.id;save()}
      document.title=`${route==="home"?"IDIOFYISCODER":route.split("/").pop().replaceAll("-"," ").replace(/\b\w/g,x=>x.toUpperCase())+" · IDC"} — Global Coding Competition Platform`;
      if(location.hash.startsWith("#/verify?")){}
      document.querySelectorAll("[data-count]").forEach(el=>{if("IntersectionObserver"in window){const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)){animateCount(el);observer.disconnect()}},{threshold:.15});observer.observe(el)}else animateCount(el)});
      updateCountdown();
    }
    function myCompetitionsPage(){const list=data.competitions.filter(c=>data.registrations.includes(c.id));return `<section class="page compact">${pageTitle("YOUR EVENTS","My competitions","Rounds you have registered for.")}${list.length?`<div class="competition-grid">${list.map(compCard).join("")}</div>`:`<div class="empty"><div class="empty-mark">⌁</div><h3>No registrations yet</h3><p>Find a competition and reserve your place.</p><button class="button primary" data-route="competitions">Explore competitions</button></div>`}</section>`}
    const appState={compTab:"All",compDifficulty:"",compCountry:"",compDuration:"",compPrize:"",compDate:"",competitionTab:"Overview",leaderSearch:"",countryFilter:"All",studentSearch:"",studentCountry:"All",studentLang:"All",language:"Python",searchQuery:"",rankTab:"Global"};
    function animateCount(el){const end=Number(el.dataset.count);const suffix=end>=1e6?"M+":end>=1e3?"K+": "+";const base=end>=1e6?end/1e6:end>=1e3?end/1e3:end;const unit=end>=1e6?1e6:end>=1e3?1e3:1;const start=performance.now(),duration=1000;function frame(now){const progress=Math.min(1,(now-start)/duration),v=Math.round(base*progress);el.textContent=`${v}${suffix}`;if(progress<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
    function updateCountdown(){document.querySelectorAll("[data-countdown]").forEach(el=>{const delta=Math.max(0,new Date(el.dataset.countdown)-Date.now());const days=Math.floor(delta/864e5),hours=Math.floor(delta%864e5/36e5),mins=Math.floor(delta%36e5/6e4),secs=Math.floor(delta%6e4/1e3);el.textContent=`${days}d ${String(hours).padStart(2,"0")}h ${String(mins).padStart(2,"0")}m ${String(secs).padStart(2,"0")}s`})}

    /* STORAGE + AUTH */
    async function hashPassword(value){if(globalThis.crypto?.subtle){const bytes=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return [...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,"0")).join("")}let h=2166136261;for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619)}return `demo-${(h>>>0).toString(16)}`}
    function signIn(user){data.session=user.id;save();toast(`Welcome back, ${user.name.split(" ")[0]}.`,"success");routeTo(user.role==="admin"?"admin":"dashboard")}
    async function handleLogin(form){const fd=new FormData(form),identity=String(fd.get("identity")).trim().toLowerCase(),password=String(fd.get("password"));const user=data.users.find(u=>u.email.toLowerCase()===identity||u.username.toLowerCase()===identity);if(!user){toast("Account not found. Check the email or username.","error");return}const demo=DEMO_ACCOUNT[user.email.toLowerCase()];let ok=demo?demo.password===password:!!user.passwordHash&&user.passwordHash===await hashPassword(password);if(!ok){toast("Password did not match this demo account.","error");return}if(user.status==="Suspended"){toast("This demo account is suspended.","error");return}signIn(user)}
    async function handleRegister(form){const fd=new FormData(form),name=String(fd.get("name")).trim(),username=String(fd.get("username")).trim().toLowerCase(),email=String(fd.get("email")).trim().toLowerCase(),password=String(fd.get("password")),confirm=String(fd.get("confirm"));if(password!==confirm){toast("Passwords do not match.","error");return}if(!/^[a-z0-9_]{3,20}$/.test(username)){toast("Username must be 3–20 letters, numbers, or underscores.","error");return}if(data.users.some(u=>u.email.toLowerCase()===email)){toast("An account already uses that email.","error");return}if(data.users.some(u=>u.username.toLowerCase()===username)){toast("That username is already taken.","error");return}const photo=form.querySelector('input[name="photo"]').files?.[0];let avatarData="";if(photo){if(!photo.type.startsWith("image/")){toast("Choose an image file for your profile photo.","error");return}if(photo.size>180000){toast("For this demo, profile photos must be under 180 KB.","error");return}avatarData=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>resolve("");r.readAsDataURL(photo)})}const user={id:uid("u"),name,username,email,country:String(fd.get("country")),city:String(fd.get("city")||""),school:String(fd.get("school")||""),role:"student",status:"Active",joinDate:new Date().toISOString(),rank:data.users.length+1,score:0,solved:0,experience:String(fd.get("experience")||"Beginner"),languages:fd.getAll("languages").map(String),bio:String(fd.get("bio")||"").trim()||"New to the global coding community.",skills:[{name:"Python",level:20},{name:"C++",level:15},{name:"JavaScript",level:10}],color:palette[data.users.length%4],avatar:avatarData,passwordHash:await hashPassword(password)};data.users.push(user);data.session=user.id;save();toast("Registration successful. Welcome to IDC!","success");routeTo("dashboard")}
    function logout(){data.session=null;save();toast("You have signed out.","info");routeTo("home")}

    /* COMPETITIONS */
    function registerCompetition(id){if(!currentUser()){toast("Sign in to register for a competition.","warning");routeTo("login");return}if(data.registrations.includes(id)){toast("You're already registered for this competition.","info");return}const c=getCompetition(id);if(c.maxParticipants&&c.participants>=c.maxParticipants){toast("This competition has reached its participant limit.","error");return}data.registrations.push(id);c.participants++;data.notifications.unshift({id:uid("n"),title:`Registration confirmed: ${c.name}`,body:"Your place is reserved. Check the competition details for event information.",date:new Date().toISOString(),read:false,kind:"competition"});save();toast("Competition registered successfully.","success");render()}

    /* CODING ARENA — demo adapter intentionally never executes submitted source. */
    // Production deployment requires a secure backend, real authentication, database, and isolated code execution service.
    async function submitCode(mode){const editor=document.querySelector("#code-editor");if(!editor)return;const source=editor.value.trim(),language=document.querySelector("#language-select").value,p=getProblem(getRoute().split("/")[1]||data.lastProblem),out=document.querySelector("#console-output");data.codeByProblem[p.id]??={};data.codeByProblem[p.id][language]=editor.value;save();if(!source){toast("Write a solution before submitting.","error");return}out.textContent="Connecting to demo judge…";await new Promise(r=>setTimeout(r,650));const valid=source.length>36;const status=valid?"Accepted":"Wrong Answer";out.textContent=`IDC DEMO JUDGE · ${mode.toUpperCase()}\n\n${valid?"✓":"×"} Test cases: ${valid?`${p.testCases}/${p.testCases} passed`:`1/${p.testCases} passed`}\nStatus: ${status}\nScore: ${valid?p.points:0}/${p.points}\nRuntime: 0.04s · Memory: 12 MB\n\nThis is a simulated result. Your code was not run.`;if(mode==="submit"){const u=currentUser()||data.users[0];data.submissions.push({id:uid("S"),userId:u.id,problemId:p.id,language,status,score:valid?p.points:0,time:"0.04s",date:new Date().toISOString()});if(valid){u.solved++;u.score+=p.points;const first=data.achievements.find(a=>a.name==="First Accepted Solution");if(first&&!first.earned){first.earned=true;setTimeout(()=>openModal("Achievement unlocked",achievementCard(first)),550)}}data.notifications.unshift({id:uid("n"),title:`${status}: ${p.title}`,body:`${language} · ${valid?p.points:0} points in the demo judge.`,date:new Date().toISOString(),read:false,kind:"submission"});save();toast("Submission recorded in demo history.","success")}else toast("Demo test run complete.","success")}

    /* MODALS */
    function openModal(title,body){document.querySelector("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">×</button></header><div class="modal-body">${body}</div></section></div>`;document.querySelector(".modal-backdrop").addEventListener("click",e=>{if(e.target.classList.contains("modal-backdrop"))closeModal()});document.querySelector(".modal .button, .modal input")?.focus()}
    function closeModal(){document.querySelector("#modal-root").innerHTML=""}
    function competitionForm(c){c=c||{name:"",description:"",start:daysFromNow(7),end:daysFromNow(8),duration:120,difficulty:"Medium",rules:"",prize:"$500",maxParticipants:1000};return `<form id="competition-form" data-id="${esc(c.id||"")}"><div class="form-grid"><div class="field full"><label class="label">Competition name</label><input class="input" name="name" required value="${esc(c.name)}"></div><div class="field full"><label class="label">Description</label><textarea class="textarea" name="description" required>${esc(c.description)}</textarea></div><div class="field"><label class="label">Start date</label><input class="input" type="datetime-local" name="start" required value="${new Date(c.start).toISOString().slice(0,16)}"></div><div class="field"><label class="label">End date</label><input class="input" type="datetime-local" name="end" required value="${new Date(c.end).toISOString().slice(0,16)}"></div><div class="field"><label class="label">Duration (minutes)</label><input class="input" name="duration" type="number" min="15" value="${c.duration}" required></div><div class="field"><label class="label">Difficulty</label><select class="select" name="difficulty">${difficulties.map(d=>`<option ${c.difficulty===d?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label class="label">Prize / recognition</label><input class="input" name="prize" value="${esc(c.prize)}"></div><div class="field"><label class="label">Maximum participants</label><input class="input" name="maxParticipants" type="number" min="1" value="${c.maxParticipants||1000}"></div><div class="field full"><label class="label">Rules</label><textarea class="textarea" name="rules">${esc(c.rules)}</textarea></div><div class="field full"><button class="button primary" type="submit">${c.id?"Save changes":"Create competition"}</button></div></div></form>`}
    function problemForm(p){p=p||{title:"",description:"",difficulty:"Easy",points:100,input:"",output:"",constraints:"",timeLimit:2,memoryLimit:256};return `<form id="problem-form" data-id="${esc(p.id||"")}"><div class="form-grid"><div class="field full"><label class="label">Title</label><input class="input" name="title" required value="${esc(p.title)}"></div><div class="field full"><label class="label">Description</label><textarea class="textarea" name="description" required>${esc(p.description)}</textarea></div><div class="field"><label class="label">Difficulty</label><select class="select" name="difficulty">${difficulties.map(d=>`<option ${p.difficulty===d?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label class="label">Points</label><input class="input" name="points" type="number" min="1" value="${p.points}" required></div><div class="field"><label class="label">Time limit (sec)</label><input class="input" name="timeLimit" type="number" min="1" value="${p.timeLimit}" required></div><div class="field"><label class="label">Memory limit (MB)</label><input class="input" name="memoryLimit" type="number" min="16" value="${p.memoryLimit}" required></div><div class="field"><label class="label">Input</label><textarea class="textarea" name="input">${esc(p.input)}</textarea></div><div class="field"><label class="label">Output</label><textarea class="textarea" name="output">${esc(p.output)}</textarea></div><div class="field full"><label class="label">Constraints</label><textarea class="textarea" name="constraints">${esc(p.constraints)}</textarea></div><div class="field full"><button class="button primary" type="submit">${p.id?"Save problem":"Create problem"}</button></div></div></form>`}
    function searchOpen(){document.querySelector("#modal-root").innerHTML=`<div class="search-overlay" id="search-overlay"><div class="search-box"><div class="search-box-top"><div class="between"><input class="input" id="global-search" placeholder="Search students, competitions, problems…" value="${esc(appState.searchQuery)}" autocomplete="off" aria-label="Search everything"><button class="button ghost small" data-action="close-modal">Esc</button></div></div><div class="search-results" id="search-results">${searchResults(appState.searchQuery)}</div><div class="micro" style="padding:0 14px 12px">Search across the demo platform · Press / to open, Esc to close</div></div></div>`;document.querySelector("#global-search")?.focus()}
    function searchResults(q){if(!q.trim())return `<div class="smalltext" style="padding:12px">Try a student, competition, or problem name.</div>`;const n=q.toLowerCase();const results=[...data.users.filter(u=>(u.name+" "+u.username).toLowerCase().includes(n)).slice(0,4).map(u=>({label:u.name,desc:`@${u.username} · ${u.country}`,route:`student/${u.username}`,type:"STUDENT"})),...data.competitions.filter(c=>c.name.toLowerCase().includes(n)).slice(0,4).map(c=>({label:c.name,desc:`${c.status} · ${c.difficulty}`,route:`competition/${c.id}`,type:"COMPETITION"})),...data.problems.filter(p=>p.title.toLowerCase().includes(n)).slice(0,4).map(p=>({label:p.title,desc:`${p.difficulty} · ${p.points} points`,route:`problem/${p.id}`,type:"PROBLEM"}))];return results.length?results.map(r=>`<button class="search-result" data-route="${esc(r.route)}"><span><strong>${esc(r.label)}</strong><br><span class="micro">${esc(r.desc)}</span></span><span class="pill">${r.type}</span></button>`).join(""):`<div class="empty">No results found.</div>`}

    /* EVENT HANDLERS */
    document.addEventListener("click",async e=>{
      const routeEl=e.target.closest("[data-route]");if(routeEl){e.preventDefault();closeModal();routeTo(routeEl.dataset.route);return}
      const b=e.target.closest("[data-action]");if(!b)return;const action=b.dataset.action,id=b.dataset.id;
      if(action==="search")searchOpen();
      if(action==="close-modal")closeModal();
      if(action==="theme"){data.theme=data.theme==="light"?"dark":"light";save();document.body.dataset.theme=data.theme;render()}
      if(action==="mobile-menu")document.querySelector("#mobile-drawer")?.classList.toggle("open");
      if(action==="logout")logout();
      if(action==="demo-social")toast("Google and GitHub sign-in are display-only in this standalone demo. Use one of the sample accounts.","warning");
      if(action==="register-comp")registerCompetition(id);
      if(action==="comp-tab"){appState.compTab=b.dataset.value;render()}
      if(action==="competition-tab"){appState.competitionTab=b.dataset.value;render()}
      if(action==="rank-tab"){appState.rankTab=b.dataset.value;document.querySelectorAll(".tabs .tab").forEach(tab=>tab.classList.toggle("active",tab.dataset.value===appState.rankTab));const board=document.querySelector("#leader-table");if(board)board.innerHTML=leaderboardView()}
      if(action==="faq-toggle"){const item=b.closest(".faq-item");item.classList.toggle("open");b.setAttribute("aria-expanded",item.classList.contains("open"))}
      if(action==="run-code")submitCode("run");
      if(action==="submit-code")submitCode("submit");
      if(action==="reset-code"){const p=getProblem(getRoute().split("/")[1]||data.lastProblem);if(data.codeByProblem[p.id])delete data.codeByProblem[p.id][appState.language];save();render();toast("Starter code restored.","info")}
      if(action==="fullscreen"){const editor=document.querySelector("#code-editor");if(editor?.requestFullscreen)editor.requestFullscreen().catch(()=>toast("Fullscreen is not available in this browser.","warning"));else toast("Fullscreen is not available in this browser.","warning")}
      if(action==="edit-profile"){const u=currentUser();openModal("Edit your profile",`<form id="profile-form"><div class="field"><label class="label">Full name</label><input class="input" name="name" required value="${esc(u.name)}"></div><div class="field"><label class="label">City</label><input class="input" name="city" value="${esc(u.city)}"></div><div class="field"><label class="label">School / university</label><input class="input" name="school" value="${esc(u.school)}"></div><div class="field"><label class="label">Bio</label><textarea class="textarea" name="bio" maxlength="240">${esc(u.bio)}</textarea></div><div class="field"><label class="label">Languages (comma-separated)</label><input class="input" name="languages" value="${esc(u.languages.join(", "))}"></div><button class="button primary" type="submit">Save profile</button></form>`)}
      if(action==="submission-detail"){const s=data.submissions.find(x=>x.id===id);if(s)openModal(`Submission ${s.id}`,`<div class="between"><span class="badge ${s.status.toLowerCase().replaceAll(" ","-")}">${esc(s.status)}</span><strong>${s.score} points</strong></div><div class="divider"></div><p class="smalltext"><strong>Problem:</strong> ${esc(getProblem(s.problemId).title)}</p><p class="smalltext"><strong>Language:</strong> ${esc(s.language)}</p><p class="smalltext"><strong>Runtime:</strong> ${esc(s.time)}</p><p class="smalltext"><strong>Date:</strong> ${fmtDate(s.date)}</p><div class="demo-notice">This is a sample submission record, not the result of secure code execution.</div>`)}
      if(action==="certificate-detail"){const c=data.certificates.find(x=>x.id===id);if(c)openModal("Verified achievement certificate",`<div style="text-align:center;padding:15px"><div class="brand-mark" style="margin:auto">${logoSvg}</div><div class="eyebrow" style="justify-content:center;margin-top:18px">IDIOFYISCODER · CERTIFICATE</div><h2 class="h2" style="margin:13px 0">${esc(c.achievement)}</h2><p class="smalltext">Awarded to <strong>${esc(getUser(c.userId).name)}</strong></p><p class="smalltext">${esc(c.competition)}</p><div class="divider"></div><div class="between"><span class="micro">ID ${esc(c.id)}</span><span class="micro">${fmtDate(c.date)}</span></div><div style="margin:18px auto 0;width:74px;height:74px;border:5px dotted var(--cyan);display:grid;place-items:center;color:var(--cyan);font-size:21px">✓</div><div class="pill green" style="margin-top:13px">VALID · DEMO RECORD</div></div>`)}
      if(action==="mark-read"){const n=data.notifications.find(x=>x.id===id);if(n)n.read=true;save();render()}
      if(action==="mark-all-read"){data.notifications.forEach(n=>n.read=true);save();render();toast("All notifications marked as read.","success")}
      if(action==="delete-notification"){data.notifications=data.notifications.filter(n=>n.id!==id);save();render();toast("Notification dismissed.","info")}
      if(action==="reset-demo"){if(confirm("Reset all demo data on this device? Locally registered accounts and changes will be removed.")){resetData();toast("Demo data reset.","success");routeTo("home")}}
      if(action==="new-competition")openModal("Create competition",competitionForm());
      if(action==="edit-competition")openModal("Edit competition",competitionForm(getCompetition(id)));
      if(action==="toggle-publish"){const c=getCompetition(id);c.published=!c.published;if(!c.published)c.status="Archived";else if(c.status==="Archived")c.status="Upcoming";save();render();toast(c.published?"Competition published.":"Competition archived.","success")}
      if(action==="new-problem")openModal("Create a problem",problemForm());
      if(action==="edit-problem")openModal("Edit problem",problemForm(getProblem(id)));
      if(action==="duplicate-problem"){const p=getProblem(id);data.problems.push({...p,id:uid("p"),title:`${p.title} (copy)`});save();render();toast("Problem duplicated.","success")}
      if(action==="delete-problem"){if(confirm("Delete this demo problem?")){data.problems=data.problems.filter(p=>p.id!==id);save();render();toast("Problem deleted.","success")}}
      if(action==="toggle-user"){const u=data.users.find(x=>x.id===id);if(u){u.status=u.status==="Active"?"Suspended":"Active";save();render();toast(`Account ${u.status.toLowerCase()}.`,"success")}}
      if(action==="new-announcement")openModal("Publish announcement",`<form id="announcement-form"><div class="field"><label class="label">Title</label><input class="input" name="title" required></div><div class="field"><label class="label">Message</label><textarea class="textarea" name="message" required></textarea></div><div class="field"><label class="label">Competition</label><select class="select" name="competitionId"><option value="">Platform-wide</option>${data.competitions.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><button class="button primary" type="submit">Publish announcement</button></form>`)
      if(action==="delete-announcement"){if(confirm("Delete this announcement?")){data.announcements=data.announcements.filter(a=>a.id!==id);save();render();toast("Announcement deleted.","success")}}
    });
    document.addEventListener("input",e=>{
      if(e.target.id==="leader-search"){appState.leaderSearch=e.target.value;const el=document.querySelector("#leader-table");if(el)el.innerHTML=leaderboardView()}
      if(e.target.id==="student-search"){appState.studentSearch=e.target.value;const route=getRoute();if(route==="students"){const position=e.target.selectionStart;render();const input=document.querySelector("#student-search");input?.focus();input?.setSelectionRange(position,position)}}
      if(e.target.id==="global-search"){appState.searchQuery=e.target.value;const el=document.querySelector("#search-results");if(el)el.innerHTML=searchResults(e.target.value)}
      if(e.target.id==="reg-pass"){const v=e.target.value,score=(v.length>=8)+(/[A-Z]/.test(v))+(/[0-9]/.test(v))+(/[^a-zA-Z0-9]/.test(v));const m=document.querySelector("#password-meter");if(m){m.style.width=`${score*25}%`;m.style.background=score<2?"var(--red)":score<4?"var(--amber)":"var(--green)"}}
    });
    document.addEventListener("change",e=>{
      if(e.target.id==="difficulty-filter"){appState.compDifficulty=e.target.value;const el=document.querySelector("#competition-results");if(el)el.innerHTML=filteredCompetitions().map(compCard).join("")||`<div class="empty" style="grid-column:1/-1">No competitions found.</div>`}
      if(["country-comp-filter","duration-filter","prize-filter","date-filter"].includes(e.target.id)){if(e.target.id==="country-comp-filter")appState.compCountry=e.target.value;if(e.target.id==="duration-filter")appState.compDuration=e.target.value;if(e.target.id==="prize-filter")appState.compPrize=e.target.value;if(e.target.id==="date-filter")appState.compDate=e.target.value;const el=document.querySelector("#competition-results");if(el)el.innerHTML=filteredCompetitions().map(compCard).join("")||`<div class="empty" style="grid-column:1/-1">No competitions match those filters.</div>`}
      if(e.target.id==="country-filter"){appState.countryFilter=e.target.value;const el=document.querySelector("#leader-table");if(el)el.innerHTML=leaderboardView()}
      if(e.target.id==="student-country"){appState.studentCountry=e.target.value;render()}
      if(e.target.id==="student-language"){appState.studentLang=e.target.value;render()}
      if(e.target.id==="language-select"){const p=getProblem(getRoute().split("/")[1]||data.lastProblem);data.codeByProblem[p.id]??={};data.codeByProblem[p.id][appState.language]=document.querySelector("#code-editor")?.value||"";save();appState.language=e.target.value;render()}
    });
    document.addEventListener("submit",async e=>{
      const form=e.target;if(!form.id)return;e.preventDefault();const fd=new FormData(form);
      if(form.id==="login-form")return handleLogin(form);
      if(form.id==="register-form")return handleRegister(form);
      if(form.id==="forgot-form"){toast("If this were a connected service, a reset link would be sent. No email was sent.","info");routeTo("login")}
      if(form.id==="profile-form"){const u=currentUser();u.name=String(fd.get("name")).trim();u.city=String(fd.get("city")||"").trim();u.school=String(fd.get("school")||"").trim();u.bio=String(fd.get("bio")||"").trim();u.languages=String(fd.get("languages")||"").split(",").map(x=>x.trim()).filter(Boolean);save();closeModal();render();toast("Profile updated.","success")}
      if(form.id==="settings-form"){data.settings.publicProfile=fd.has("publicProfile");data.settings.emailUpdates=fd.has("emailUpdates");save();toast("Preferences saved.","success")}
      if(form.id==="verify-form"){const c=data.certificates.find(x=>x.id.toLowerCase()===String(fd.get("certificateId")).trim().toLowerCase()),result=document.querySelector("#verify-result");if(result)result.innerHTML=c?`<div class="card soft"><span class="pill green">VALID CERTIFICATE</span><h3 class="h3" style="margin-top:13px">${esc(getUser(c.userId).name)}</h3><div class="smalltext">${esc(c.competition)}</div><div class="micro" style="margin-top:8px">${esc(c.achievement)} · Issued ${fmtDate(c.date)}</div><div class="micro">Certificate ID: ${esc(c.id)}</div></div>`:`<div class="card soft"><span class="pill red">NOT FOUND</span><p class="smalltext">We could not find that ID in the sample certificate records. Check the characters and try again.</p></div>`}
      if(form.id==="contact-form"){data.contacts.push({id:uid("msg"),name:String(fd.get("name")),email:String(fd.get("email")),subject:String(fd.get("subject")),message:String(fd.get("message")),date:new Date().toISOString()});save();form.reset();toast("Thanks. Your note was saved in this browser demo; nothing was sent.","success")}
      if(form.id==="competition-form"){const id=form.dataset.id,existing=id?getCompetition(id):null;const start=new Date(String(fd.get("start"))),end=new Date(String(fd.get("end")));if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime())){toast("Enter valid start and end dates.","error");return}const obj={name:String(fd.get("name")).trim(),description:String(fd.get("description")).trim(),start:start.toISOString(),end:end.toISOString(),duration:Number(fd.get("duration")),difficulty:String(fd.get("difficulty")),rules:String(fd.get("rules")||""),prize:String(fd.get("prize")||"Recognition"),maxParticipants:Number(fd.get("maxParticipants")||1000),participants:existing?.participants||0,problems:existing?.problems||5,status:existing?.status||"Upcoming",published:existing?.published||false,problemIds:existing?.problemIds||[]};if(end<=start){toast("End time must be after start time.","error");return}if(id){Object.assign(existing,obj);toast("Competition updated.","success")}else{obj.id=uid("c");data.competitions.unshift(obj);toast("Competition created as a draft.","success")}save();closeModal();render()}
      if(form.id==="problem-form"){const id=form.dataset.id,obj={title:String(fd.get("title")).trim(),description:String(fd.get("description")).trim(),difficulty:String(fd.get("difficulty")),points:Number(fd.get("points")),timeLimit:Number(fd.get("timeLimit")),memoryLimit:Number(fd.get("memoryLimit")),input:String(fd.get("input")),output:String(fd.get("output")),constraints:String(fd.get("constraints")),examples:[{input:"Example input",output:"Example output",explanation:"Sample case"}],hints:["Review the problem constraints."],testCases:2};if(id){Object.assign(getProblem(id),obj);toast("Problem updated.","success")}else{obj.id=uid("p");data.problems.push(obj);toast("Problem created.","success")}save();closeModal();render()}
      if(form.id==="announcement-form"){data.announcements.unshift({id:uid("an"),title:String(fd.get("title")).trim(),message:String(fd.get("message")).trim(),competitionId:String(fd.get("competitionId")||""),date:new Date().toISOString()});data.notifications.unshift({id:uid("n"),title:`New announcement: ${String(fd.get("title")).trim()}`,body:String(fd.get("message")).trim(),date:new Date().toISOString(),read:false,kind:"announcement"});save();closeModal();render();toast("Announcement published.","success")}
    });
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();document.querySelector("#mobile-drawer")?.classList.remove("open")}if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();searchOpen()}});
    window.addEventListener("hashchange",()=>{appState.competitionTab="Overview";render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})});
    window.addEventListener("scroll",()=>document.querySelector("#topbar")?.classList.toggle("scrolled",window.scrollY>8),{passive:true});
    window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY){try{data=JSON.parse(e.newValue);render()}catch{}}});

    /* INITIALIZATION */
    document.querySelector("#loader-logo").innerHTML=logoSvg;
    render();
    setInterval(updateCountdown,1000);
    setTimeout(()=>document.querySelector("#loader")?.classList.add("done"),420);
  })();
  </script>
</body>
</html>
