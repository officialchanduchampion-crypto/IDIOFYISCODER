    const fmtDate=(date,opts={month:"short",day:"numeric",year:"numeric"})=>new Date(date).toLocaleDateString("en-US",opts);

    const logoSvg=`<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M16 11v26M35.4 15.3A14 14 0 1 0 35.4 32.7M16 24h11" stroke="url(#lg)" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="10" y1="8" x2="39" y2="40"><stop stop-color="#68E6E8"/><stop offset="1" stop-color="#7196FF"/></linearGradient></defs></svg>`;
    const iconPaths={home:"M3 10.8 12 3l9 7.8V21H3z M9 21v-7h6v7",trophy:"M8 21h8m-4-4v4M7 4h10v5a5 5 0 0 1-10 0zM7 7H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4",users:"M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2m5-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8m8-7.8a4 4 0 0 1 0 7.6m6 10v-2a4 4 0 0 0-3-3.87",chart:"M3 3v18h18M8 15l4-4 4 3 5-7",code:"m8 8-5 4 5 4m8-8 5 4-5 4m-3-12-2 16",bell:"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4",settings:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0-5v2m0 14v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M3 12h2m14 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4",search:"M20 20l-4.5-4.5m2-5.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0z",award:"M12 15l-3 6-1-4-4-1 5-3m3 2 3 6 1-4 4-1-5-3m-3-11a6 6 0 1 0 0 12 6 6 0 0 0 0-12z",file:"M7 3h7l5 5v13H7zM14 3v6h5M10 13h6m-6 4h6",logout:"M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7",menu:"M3 6h18M3 12h18M3 18h18",sun:"M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"};

    const toast=(message,type="info")=>{const el=document.createElement("div");el.className=`toast ${type}`;el.innerHTML=`<strong>${type==="success"?"✓":type==="error"?"!":"i"}</strong><span>${esc(message)}</span>`;document.querySelector("#toasts").append(el);setTimeout(()=>el.remove(),3600)};

    /* DATA */
    const makeSeed=()=>{
      const students=names.map((name,i)=>({id:`u${i+1}`,name,username:name.toLowerCase().replace(/[^a-z]+/g,"_"),email:i===0?"student@idiofyiscoder.com":`${name.toLowerCase().replace(/[^a-z]+/g,".")}@example.com`,country:countries[i%countries.length],city:["Mumbai","Seattle","Tokyo","Lyon","Toronto","Pune","London","Lagos","Berlin","Osaka"][i%10],school:["Northstar Institute","Meridian University","Pacific Tech","École Nouvelle","Western College"][i%5],role:i===1?"admin":"student",status:"Active",joinDate:daysFromNow(-((i+1)*27)),rank:i+1,score:9820-i*317,solved:140-i*4,experience:["Intermediate","Advanced","Beginner","Expert"][i%4],languages:[LANGS[(i+1)%LANGS.length],LANGS[(i+4)%LANGS.length],LANGS[(i+6)%LANGS.length]],bio:i===0?"Curious problem solver. Building one clean solution at a time.":"Competitive programmer, lifelong learner, and builder of thoughtful software.",skills:[{name:"C++",level:92-i%20},{name:"Python",level:86-i%16},{name:"JavaScript",level:78-i%24}],color:palette[i%4]}));
      const competitions=Array.from({length:10},(_,i)=>({id:`c${i+1}`,name:["IDC Global Code Challenge 2026","Open Algorithm Sprint","AI & Data Structures Cup","Campus Coder League","Weekend Debug Derby","International Graph Quest","Women in Code Open","Summer Systems Challenge","Rising Stars Invitational","World Finals: The Last Byte"][i],status:i===1?"Live":i<5?"Upcoming":"Completed",difficulty:difficulties[i%4],start:daysFromNow(i===1?0:i<5?i*8+2:-i*9),end:daysFromNow(i===1?1:i<5?i*8+3:-i*9+1),duration:[120,90,180,75,60,150,120,240,90,180][i],problems:5+i%5,participants:1600+i*487,prize:["$5,000","$2,500","$1,500","Scholarships","$750"][i%5],maxParticipants:5000,description:"A focused global challenge built for curious programmers. Solve carefully designed problems, learn from every round, and compare your approach with an international community.",rules:"Use only your own work. Do not share solutions during the live round. Submissions are scored against public and hidden test cases. Be respectful to every participant.",published:true,problemIds:Array.from({length:5+i%4},(_,j)=>`p${(i*2+j)%20+1}`)}));
      const problems=titles.map((title,i)=>({id:`p${i+1}`,title,difficulty:difficulties[i%4],points:[100,200,350,500][i%4],timeLimit:[1,2,2,3][i%4],memoryLimit:256,description:`Given the input described below, design an efficient solution to ${title.toLowerCase()}. Return the result for every valid input while meeting the stated constraints.`,input:"A sequence of values followed by the required target or query.",output:"Print the requested result on one line.",constraints:"1 ≤ n ≤ 100,000\nValues are within the signed 32-bit integer range.",examples:[{input:"5 9\n2 7 11 15 3",output:"0 1",explanation:"The first two values add to the target."},{input:"4 6\n1 4 2 8",output:"-1",explanation:"No valid pair exists."}],hints:["Start with a direct approach, then look for repeated work.","Consider the input constraints before selecting a data structure."],testCases:3+i%5}));
      const submissions=Array.from({length:50},(_,i)=>({id:`S-${String(8150+i).padStart(5,"0")}`,userId:students[i%students.length].id,problemId:problems[(i*3)%problems.length].id,language:LANGS[i%LANGS.length],status:["Accepted","Accepted","Wrong Answer","Accepted","Runtime Error"][i%5],score:[100,200,0,350,0][i%5],time:`${(i%2)+0}.${i%9}s`,date:daysFromNow(-i%20)}));

      const certificates=students.slice(0,10).map((u,i)=>({id:`IDC-2026-${String(10421+i).padStart(5,"0")}`,userId:u.id,competition:competitions[i].name,achievement:i%2?"Top 10% Finalist":"Participation Certificate",date:daysFromNow(-i*12),valid:true}));
      const notifications=Array.from({length:20},(_,i)=>({id:`n${i+1}`,title:["Your registration for Global Code Challenge is confirmed.","Competition starts in 30 minutes.","You earned the Top 100 badge.","Your certificate is ready.","New problem set added to the practice arena."][i%5],body:"Open your workspace to see the details and next steps.",date:daysFromNow(-i),read:i>4,kind:["competition","reminder","achievement","certificate","problem"][i%5]}));
      return {users:students,competitions,problems,submissions,achievements,certificates,notifications,announcements:[{id:"an1",title:"Welcome to the new season",message:"The 2026 global season is now open. Explore the calendar and find your next challenge.",date:daysFromNow(-2),competitionId:"c1"}],registrations:["c1"],contacts:[],session:null,theme:"dark",codeByProblem:{},lastProblem:"p1",settings:{publicProfile:true,emailUpdates:true}};

    const activeUser=currentUser();

    /* COMPONENTS */
    function compCard(c,i=0){return `<article class="card comp-card hoverable"><div class="comp-banner ${i%3===1?"alt":i%3===2?"warm":""}"><h3>${esc(c.name)}</h3><span class="pill ${c.status==="Live"?"live":"blue"}">${esc(c.status.toUpperCase())}</span></div><div class="comp-content"><div class="between"><span class="badge ${c.difficulty.toLowerCase()}">${esc(c.difficulty)}</span><span class="micro">${fmtDate(c.start,{month:"short",day:"numeric"})}</span></div><div class="comp-meta"><span>${icon("code",13)} ${c.problems} problems</span><span>${icon("users",13)} ${Number(c.participants).toLocaleString()} participants</span><span>◷ ${c.duration} min</span></div><div class="comp-bottom"><span class="smalltext">Prize <strong style="color:var(--text)">${esc(c.prize)}</strong></span><div class="row"><button class="button secondary small" data-route="competition/${esc(c.id)}">Details</button><button class="button primary small" data-action="register-comp" data-id="${esc(c.id)}">${data.registrations.includes(c.id)?"Registered":"Register"}</button></div></div></div></article>`}
    function pageTitle(kicker,title,sub,actions=""){return `<div class="section-head"><div><div class="eyebrow">${esc(kicker)}</div><h1 class="h2" style="margin-top:12px">${title}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>${actions}</div>`}
    function statCard(label,value,note,ico="chart"){return `<div class="card hoverable"><div class="between"><div><div class="stat">${value}</div><div class="stat-label">${label}</div></div><div class="card-icon" style="margin:0">${icon(ico,18)}</div></div>${note?`<div class="stat-note">${note}</div>`:""}</div>`}
    function chartSvg(){return `<svg class="chart" viewBox="0 0 600 190" role="img" aria-label="Weekly coding activity trend"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6e9dff" stop-opacity=".3"/><stop offset="1" stop-color="#6e9dff" stop-opacity="0"/></linearGradient></defs><g class="chart-grid"><line x1="38" y1="24" x2="590" y2="24"/><line x1="38" y1="69" x2="590" y2="69"/><line x1="38" y1="114" x2="590" y2="114"/><line x1="38" y1="159" x2="590" y2="159"/></g><path class="chart-area" d="M38 142 C80 132 84 98 130 108 S188 134 230 86 S290 91 326 70 S384 94 422 58 S480 75 520 43 S558 55 590 26 L590 160 L38 160Z"/><path class="chart-line" d="M38 142 C80 132 84 98 130 108 S188 134 230 86 S290 91 326 70 S384 94 422 58 S480 75 520 43 S558 55 590 26"/><circle cx="590" cy="26" r="5" class="chart-dot"/><text x="35" y="180" class="chart-label">Mon</text><text x="124" y="180" class="chart-label">Tue</text><text x="215" y="180" class="chart-label">Wed</text><text x="307" y="180" class="chart-label">Thu</text><text x="398" y="180" class="chart-label">Fri</text><text x="489" y="180" class="chart-label">Sat</text><text x="570" y="180" class="chart-label">Sun</text></svg>`}
    function footer(){return `<footer class="footer"><div class="wrap"><div class="footer-grid"><div><a class="brand" href="#/home"><i class="brand-mark">${logoSvg}</i><span>IDIOFYISCODER</span></a><p>Code globally. Grow endlessly.</p><p>Make your next great solution count.</p></div><div><h4>PLATFORM</h4><a href="#/competitions">Competitions</a><a href="#/leaderboard">Leaderboard</a><a href="#/students">Students</a><a href="#/verify">Certificates</a></div><div><h4>RESOURCES</h4><a href="#/faq">FAQ</a><a href="#/about">About IDC</a><a href="#/contact">Help & contact</a></div><div><h4>COMMUNITY</h4><a href="#/students">Global coders</a><a href="#/competitions">Season calendar</a><a href="#/contact">Code of conduct</a></div></div><div class="footer-bottom"><span>© 2026 IDIOFYISCODER · Demo platform</span><span>Competition data is illustrative and stored on this device.</span></div></div></footer>`}
    function sideNav(route){const admin=route.startsWith("admin");const student=[["OVERVIEW",[[ "dashboard","Dashboard","chart"],["profile","My profile","users"],["my-competitions","My competitions","trophy"]]],["PRACTICE",[[ "arena","Coding arena","code"],["submissions","Submissions","file"]]],["REWARDS",[[ "certificates","Certificates","award"],["achievements","Achievements","trophy"],["notifications","Notifications","bell"]]],["ACCOUNT",[[ "settings","Settings","settings"]]]];const adminGroups=[["MANAGE",[[ "admin","Dashboard","chart"],["admin/competitions","Competitions","trophy"],["admin/problems","Problems","code"],["admin/users","Users","users"],["admin/submissions","Submissions","file"]]],["PLATFORM",[[ "admin/leaderboard","Leaderboard","chart"],["admin/certificates","Certificates","award"],["admin/announcements","Announcements","bell"]]],["ACCOUNT",[[ "settings","Settings","settings"]]]];const groups=admin?adminGroups:student;return `<nav class="side-nav" aria-label="${admin?"Admin":"Student"} workspace navigation">${groups.map(([label,items])=>`<div class="side-label">${label}</div>${items.map(([r,t,i])=>`<button class="side-link ${route===r?"active":""}" data-route="${r}">${icon(i,15)} ${t}${r==="notifications"&&data.notifications.filter(n=>!n.read).length?`<span class="pill blue" style="margin-left:auto">${data.notifications.filter(n=>!n.read).length}</span>`:""}</button>`).join("")}`).join("")}</nav>`}
    function workspace(route,content){return `<div class="workspace">${sideNav(route)}<section class="workspace-main">${content}</section></div>`}
    function tableHtml(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}"><div class="empty">Nothing to show yet.</div></td></tr>`}</tbody></table></div>`}

    /* ROUTER */
    function header(route){
      const user=currentUser(),links=[["home","Home"],["competitions","Competitions"],["leaderboard","Leaderboard"],["students","Students"],["about","About"]];
      return `<header class="topbar" id="topbar"><div class="wrap nav"><a href="#/home" class="brand" aria-label="IDIOFYISCODER home"><i class="brand-mark">${logoSvg}</i><span>IDIOFYISCODER</span></a><nav class="navlinks" aria-label="Main navigation">${links.map(([r,t])=>`<a class="${route===r?"active":""}" href="#/${r}">${t}</a>`).join("")}</nav><div class="nav-actions"><button class="icon-btn" data-action="search" aria-label="Search" title="Search (/)">${icon("search")}</button><button class="icon-btn" data-action="theme" aria-label="Toggle theme">${icon("sun")}</button>${user?`<button class="button secondary small nav-login" data-route="${user.role==="admin"?"admin":"dashboard"}">${user.role==="admin"?"Admin":"Workspace"}</button><button class="button primary small nav-register" data-action="logout">Sign out</button>`:`<button class="button ghost small nav-login" data-route="login">Log in</button><button class="button primary small nav-register" data-route="register">Create account</button>`}<button class="mobile-toggle" data-action="mobile-menu" aria-label="Open menu">${icon("menu")}</button></div></div><nav class="mobile-drawer" id="mobile-drawer">${links.map(([r,t])=>`<a href="#/${r}">${t}</a>`).join("")}${user?`<a href="#/${user.role==="admin"?"admin":"dashboard"}">My workspace</a><a href="#/settings">Settings</a>`:`<a href="#/login">Log in</a><a href="#/register">Create account</a>`}</nav></header>`
    }
    function homePage(){const featured=data.competitions.slice(0,3);return `<section class="hero"><div class="wrap hero-inner"><div class="hero-copy"><div class="eyebrow"><span class="pill blue">GLOBAL CODING COMPETITION PLATFORM</span></div><h1 class="h1"><span class="gradient">CODE. COMPETE.<br>CREATE. CONQUER.</span></h1><p class="subhead">Challenge yourself with programmers from around the world, solve real problems, climb the leaderboard and build your global coding profile.</p><div class="hero-actions"><button class="button primary" data-route="competitions">Start competing <span aria-hidden="true">↗</span></button><button class="button secondary" data-route="competitions">Explore competitions</button></div><div class="hero-note"><span style="color:var(--green)">●</span> <strong>Open worldwide</strong><span>·</span><span>Built for the next generation of coders</span></div></div><div class="hero-visual" aria-label="Coding dashboard illustration"><div class="orb"></div><div class="hero-core">${logoSvg}</div><div class="hero-code"><div class="code-window"><div class="code-dots"><i></i><i></i><i></i></div><pre><span class="token">function</span> solve(input) {
  <span class="token2">const</span> answer = search(input);
  <span class="token">return</span> answer;
}</pre></div></div><div class="hero-code right"><div class="code-window"><div class="between"><span class="micro">GLOBAL RANK</span><strong style="color:var(--cyan)">#${currentUser()?.rank||"128"}</strong></div><div class="tiny-bars">${[9,14,10,17,12,18,16,22,14,21,25,19].map(h=>`<i style="height:${h}px"></i>`).join("")}</div><div class="micro" style="margin-top:7px">+12 places this week</div></div></div><div class="hero-float">● Live now <strong>${data.competitions.filter(c=>c.status==="Live").length} competition</strong></div><div class="float-bottom">✦ &nbsp; Built for curious minds<br><span class="micro">Practice. Compete. Grow.</span></div></div></div><div class="wrap"><div class="stats-strip"><div><strong data-count="50000">50K+</strong><span>Students worldwide</span></div><div><strong data-count="120">120+</strong><span>Countries represented</span></div><div><strong data-count="500">500+</strong><span>Competitions hosted</span></div><div><strong data-count="1000000">1M+</strong><span>Submissions evaluated</span></div></div></div></section><section class="wrap section"><div class="section-head"><div><div class="eyebrow">YOUR NEXT CHALLENGE</div><h2 class="h2" style="margin-top:11px">Compete on a global stage.</h2><p>Fresh challenges for every level, from first-time competitor to finals contender.</p></div><button class="button secondary" data-route="competitions">All competitions ↗</button></div><div class="competition-grid">${featured.map(compCard).join("")}</div></section><section class="wrap section"><div class="section-head"><div><div class="eyebrow">MORE THAN A SCOREBOARD</div><h2 class="h2" style="margin-top:11px">A better way to grow as a coder.</h2></div></div><div class="grid g3">${[["trophy","Compete with purpose","Take on thoughtfully designed rounds and learn from every problem."],["users","Meet your people","Find ambitious student developers across cities, schools, and time zones."],["award","Build a profile that travels","Show your progress, celebrate milestones, and verify achievements." ]].map(([ic,t,d])=>`<article class="card hoverable"><div class="card-icon">${icon(ic,18)}</div><h3 class="h3">${t}</h3><p class="smalltext">${d}</p></article>`).join("")}</div></section><section class="wrap section"><div class="card" style="padding:clamp(23px,5vw,52px);background:radial-gradient(circle at 90% 10%,rgba(76,129,243,.2),transparent 37%),var(--panel)"><div class="eyebrow">YOUR FIRST ROUND STARTS HERE</div><h2 class="h2" style="margin-top:13px;max-width:680px">The world is working on the same problem. Add your solution.</h2><p class="subhead">Join a global community that takes curiosity seriously.</p><button class="button primary" data-route="register">Create your free profile ↗</button></div></section>`}
    function competitionsPage(){return `<section class="page"><div class="wrap">${pageTitle("COMPETITION HUB","Find your next challenge","Explore live rounds, upcoming events, and past competitions.")}<div class="toolbar"><div class="tabs" style="margin:0;flex:1"><button class="tab ${appState.compTab==="All"?"active":""}" data-action="comp-tab" data-value="All">All</button>${["Upcoming","Live","Completed"].map(x=>`<button class="tab ${appState.compTab===x?"active":""}" data-action="comp-tab" data-value="${x}">${x}</button>`).join("")}</div><div class="filters"><select class="select" id="difficulty-filter" aria-label="Filter by difficulty"><option value="">All levels</option>${difficulties.map(x=>`<option ${appState.compDifficulty===x?"selected":""}>${x}</option>`).join("")}</select></div></div><div class="competition-grid" id="competition-results">${filteredCompetitions().map(compCard).join("")||`<div class="empty" style="grid-column:1/-1"><div class="empty-mark">⌕</div><h3>No competitions found</h3><p>Try a different filter or check back soon.</p></div>`}</div></div></section>`}
    function filteredCompetitions(){return data.competitions.filter((c,i)=>{const until=new Date(c.start)-Date.now();return (appState.compTab==="All"||c.status===appState.compTab)&&(!appState.compDifficulty||c.difficulty===appState.compDifficulty)&&(!appState.compCountry||(c.country||countries[i%countries.length])===appState.compCountry)&&(!appState.compDuration||(appState.compDuration==="short"?c.duration<90:appState.compDuration==="medium"?c.duration>=90&&c.duration<=150:c.duration>150))&&(!appState.compPrize||(appState.compPrize==="cash"?c.prize.includes("$"):!c.prize.includes("$")))&&(!appState.compDate||(appState.compDate==="soon"?until>=0&&until<=30*864e5:until>30*864e5))})}
    function competitionPage(id){const c=getCompetition(id),tabs=["Overview","Problems","Leaderboard","Rules","Announcements"];const tab=appState.competitionTab||"Overview";let body="";if(tab==="Overview")body=`<div class="grid g2"><div class="card soft"><h3 class="panel-title">About this round</h3><p class="smalltext">${esc(c.description)}</p><div class="divider"></div><div class="grid g2"><div><span class="label">Starts</span><strong>${fmtDate(c.start,{month:"long",day:"numeric",hour:"numeric",minute:"2-digit"})}</strong></div><div><span class="label">Ends</span><strong>${fmtDate(c.end,{month:"long",day:"numeric",hour:"numeric",minute:"2-digit"})}</strong></div><div><span class="label">Duration</span><strong>${c.duration} minutes</strong></div><div><span class="label">Prize</span><strong>${esc(c.prize)}</strong></div></div></div><div class="card soft"><div class="between"><h3 class="panel-title">Round overview</h3><span class="pill ${c.status==="Live"?"live":"blue"}">${c.status}</span></div><div class="grid g2" style="margin-top:17px"><div><div class="stat">${c.problems}</div><div class="stat-label">Problems</div></div><div><div class="stat">${Number(c.participants).toLocaleString()}</div><div class="stat-label">Participants</div></div><div><div class="stat">${c.duration}m</div><div class="stat-label">Duration</div></div><div><div class="stat">${esc(c.difficulty)}</div><div class="stat-label">Difficulty</div></div></div><div class="divider"></div><div class="label">Countdown to start</div><div class="row" data-countdown="${esc(c.start)}" style="font:700 18px ui-monospace,monospace;color:var(--cyan)">--d --h --m --s</div></div></div>`;
      if(tab==="Problems")body=`<div class="grid g2">${c.problemIds.map(pid=>{const p=getProblem(pid);return `<article class="card soft hoverable"><div class="between"><h3 class="h3">${esc(p.title)}</h3><span class="badge ${p.difficulty.toLowerCase()}">${p.difficulty}</span></div><p class="smalltext">Problem ${p.id} · ${p.points} points · ${p.timeLimit} min</p><button class="button secondary small" data-route="problem/${p.id}">Open problem</button></article>`}).join("")}</div>`;
      if(tab==="Leaderboard")body=leaderboardTable(data.users.slice(0,10));
      if(tab==="Rules")body=`<div class="card soft"><h3 class="panel-title">Competition rules</h3><p class="prose">${esc(c.rules)}</p><ul class="prose"><li>One account per participant.</li><li>Submissions must be your own original work.</li><li>Be kind and follow the community code of conduct.</li><li>Organizers may review suspicious activity.</li></ul></div>`;
      if(tab==="Announcements")body=`<div class="grid">${data.announcements.filter(a=>!a.competitionId||a.competitionId===c.id).map(a=>`<article class="card soft"><span class="micro">${fmtDate(a.date)}</span><h3 class="h3" style="margin-top:8px">${esc(a.title)}</h3><p class="smalltext">${esc(a.message)}</p></article>`).join("")||`<div class="empty">No announcements yet.</div>`}</div>`;
      return `<section class="page"><div class="wrap">${pageTitle("COMPETITION DETAILS",esc(c.name),`Hosted by IDIOFYISCODER · ${c.status}`)}<div class="card" style="margin-bottom:20px;padding:0;overflow:hidden"><div class="comp-banner ${id?.slice(-1)%3===1?"alt":"warm"}" style="height:172px;padding:25px"><div><span class="pill ${c.status==="Live"?"live":"blue"}">${c.status.toUpperCase()}</span><h2 class="h2" style="margin:11px 0 0">${esc(c.name)}</h2></div></div><div class="comp-content between"><div class="row"><span class="badge ${c.difficulty.toLowerCase()}">${c.difficulty}</span><span class="smalltext">${c.problems} problems · ${c.duration} minutes · ${Number(c.participants).toLocaleString()} participants</span></div><div class="row"><button class="button secondary" data-action="register-comp" data-id="${c.id}">${data.registrations.includes(c.id)?"Registered ✓":"Register now"}</button><button class="button primary" data-route="arena/${c.id}">Enter competition ↗</button></div></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t?"active":""}" data-action="competition-tab" data-value="${t}">${t}</button>`).join("")}</div>${body}</div></section>`}
    function leaderboardTable(list=data.users){const medals=["🥇","🥈","🥉"];const rows=[...list].sort((a,b)=>a.rank-b.rank).map((u,i)=>`<tr class="${currentUser()?.id===u.id?"highlight":""}"><td><span class="rank-medal">${medals[i]||`<span class="rank">${u.rank}</span>`}</span></td><td>${i%3===0?"↑":"—"}</td><td><button class="person" style="background:none;border:0;cursor:pointer;text-align:left" data-route="student/${esc(u.username)}">${avatar(u)}<span><span class="person-name">${esc(u.name)}</span><br><span class="person-handle">@${esc(u.username)}</span></span></button></td><td>${FLAGS[u.country]||"🌐"} ${esc(u.country)}</td><td><strong>${Number(u.score).toLocaleString()}</strong></td><td>${u.solved}</td><td>${(i+1)*12}m</td><td><span class="pill green">Active</span></td></tr>`);return tableHtml(["Rank","Change","Student","Country","Score","Solved","Penalty","Status"],rows)}
    function leaderboardView(){if(appState.rankTab==="Country"){const groups=countries.map(country=>({country,users:data.users.filter(u=>u.country===country)})).filter(g=>g.users.length);return tableHtml(["Rank","Country","Students","Problems solved","Total points","Top student"],groups.map((g,i)=>{const top=g.users.slice().sort((a,b)=>b.score-a.score)[0];return `<tr><td><strong>${i+1}</strong></td><td>${FLAGS[g.country]} ${esc(g.country)}</td><td>${g.users.length}</td><td>${g.users.reduce((n,u)=>n+u.solved,0).toLocaleString()}</td><td><strong>${g.users.reduce((n,u)=>n+u.score,0).toLocaleString()}</strong></td><td>${esc(top.name)}</td></tr>`}))}if(appState.rankTab==="Competition"){return tableHtml(["Rank","Competition","Status","Difficulty","Participants","Problems","Prize"],data.competitions.slice().sort((a,b)=>b.participants-a.participants).map((c,i)=>`<tr><td><strong>${i+1}</strong></td><td><button class="button ghost small" data-route="competition/${c.id}">${esc(c.name)}</button></td><td><span class="pill ${c.status==="Live"?"live":"blue"}">${esc(c.status)}</span></td><td>${esc(c.difficulty)}</td><td>${Number(c.participants).toLocaleString()}</td><td>${c.problems}</td><td>${esc(c.prize)}</td></tr>`))}const needle=appState.leaderSearch.toLowerCase(),list=data.users.filter(u=>(appState.countryFilter==="All"||u.country===appState.countryFilter)&&(`${u.name} ${u.username} ${u.country}`).toLowerCase().includes(needle));return leaderboardTable(list)}
    function leaderboardPage(){const needle=appState.leaderSearch.toLowerCase();const users=data.users.filter(u=>(appState.countryFilter==="All"||u.country===appState.countryFilter)&&(`${u.name} ${u.username} ${u.country}`).toLowerCase().includes(needle));return `<section class="page"><div class="wrap">${pageTitle("GLOBAL STANDINGS","The global leaderboard","A snapshot of the students solving, learning, and climbing together.",`<span class="pill live">LIVE BOARD</span>`)}<div class="card soft" style="margin-bottom:17px"><div class="toolbar" style="margin:0"><input id="leader-search" class="input search-input" placeholder="Search coders or countries…" value="${esc(appState.leaderSearch)}"><select id="country-filter" class="select" style="width:auto"><option>All</option>${countries.map(c=>`<option ${appState.countryFilter===c?"selected":""}>${c}</option>`).join("")}</select><div class="tabs" style="margin:0 auto 0 8px"><button class="tab active">Global</button><button class="tab" data-action="rank-tab" data-value="Country">Country</button><button class="tab" data-action="rank-tab" data-value="Competition">Competition</button></div></div></div><div id="leader-table">${leaderboardTable(users)||""}</div><section class="section"><div class="section-head"><div><div class="eyebrow">COUNTRY SNAPSHOT</div><h2 class="h2" style="margin-top:10px">Coding around the world.</h2></div></div><div class="grid g4">${countries.slice(0,8).map((c,i)=>`<div class="card soft"><div class="between"><span style="font-size:24px">${FLAGS[c]}</span><span class="pill">${i+1}th</span></div><h3 class="h3" style="margin-top:14px">${c}</h3><div class="smalltext">${(3200-i*238).toLocaleString()} coders · ${(53000-i*3820).toLocaleString()} solved</div></div>`).join("")}</div></section></div></section>`}
    function studentsPage(){const needle=appState.studentSearch.toLowerCase();const list=data.users.filter(u=>(appState.studentCountry==="All"||u.country===appState.studentCountry)&&(appState.studentLang==="All"||u.languages.includes(appState.studentLang))&&(`${u.name} ${u.username} ${u.country}`).toLowerCase().includes(needle));return `<section class="page"><div class="wrap">${pageTitle("IDC COMMUNITY","Global coders","Meet the students building their next big idea.")}<div class="toolbar"><input class="input search-input" id="student-search" value="${esc(appState.studentSearch)}" placeholder="Search by name or username"><select id="student-country" class="select" style="width:auto"><option>All</option>${countries.map(c=>`<option ${appState.studentCountry===c?"selected":""}>${c}</option>`).join("")}</select><select id="student-language" class="select" style="width:auto"><option>All</option>${LANGS.map(l=>`<option ${appState.studentLang===l?"selected":""}>${l}</option>`).join("")}</select></div><div class="grid g3" id="student-grid">${list.map(u=>`<article class="card hoverable"><div class="between"><div class="row">${avatar(u)}<div><div class="person-name">${esc(u.name)} <span style="color:var(--cyan)">✓</span></div><div class="person-handle">@${esc(u.username)} · ${FLAGS[u.country]} ${esc(u.country)}</div></div></div><span class="pill blue">#${u.rank}</span></div><p class="smalltext" style="margin:16px 0">${esc(u.bio)}</p><div class="tag-list">${u.languages.map(l=>`<span class="pill">${esc(l)}</span>`).join("")}</div><div class="divider"></div><div class="between"><span class="smalltext">${u.solved} solved · ${Number(u.score).toLocaleString()} pts</span><button class="button secondary small" data-route="student/${esc(u.username)}">View profile</button></div></article>`).join("")||`<div class="empty" style="grid-column:1/-1">No coders match your search.</div>`}</div></div></section>`}
    function profilePage(username){const u=getUser(username||currentUser()?.username||"alex_morgan");return `<section class="page"><div class="wrap"><div class="card profile-head"><div>${avatar(u,true)}</div><div class="profile-details" style="flex:1"><div class="row" style="flex-wrap:wrap"><h1>${esc(u.name)}</h1><span class="pill cyan">✓ VERIFIED</span></div><div class="smalltext">@${esc(u.username)} · ${FLAGS[u.country]||"🌐"} ${esc(u.country)}${u.city?` · ${esc(u.city)}`:""}</div><p class="smalltext">${esc(u.bio)}</p><div class="tag-list">${u.languages.map(l=>`<span class="pill">${esc(l)}</span>`).join("")}</div></div>${currentUser()?.id===u.id?`<button class="button secondary" data-action="edit-profile">Edit profile</button>`:""}</div><div class="profile-stats" style="margin:15px 0 22px">${[["Global rank",`#${userRank(u)}`],["Country rank",`#${Math.max(1,u.rank-3)}`],["Competitions","18"],["Problems solved",u.solved],["Total score",Number(u.score).toLocaleString()],["Win rate","72%"]].map(([a,b])=>`<div class="profile-stat"><div class="label">${a}</div><strong style="font-size:19px">${b}</strong></div>`).join("")}</div><div class="grid g2"><div class="card"><h3 class="panel-title">Skills & languages</h3>${u.skills.map(s=>`<div class="skill-row"><strong>${esc(s.name)}</strong><div class="progress"><i style="--w:${s.level}%"></i></div><span>${s.level}%</span></div>`).join("")}</div><div class="card"><div class="between"><h3 class="panel-title">Competition history</h3><span class="pill blue">2026 season</span></div>${data.competitions.slice(0,4).map((c,i)=>`<div class="between" style="padding:13px 0;border-bottom:1px solid var(--line)"><div><strong style="font-size:12px">${esc(c.name)}</strong><div class="micro">${fmtDate(c.start)}</div></div><span class="pill ${i<2?"green":"blue"}">${i<2?"Top 10%":"Completed"}</span></div>`).join("")}</div></div><section class="section"><div class="section-head"><div><div class="eyebrow">MILESTONES</div><h2 class="h2" style="margin-top:8px">Achievements & certificates</h2></div></div><div class="grid g3">${data.achievements.filter(a=>a.earned).slice(0,6).map(achievementCard).join("")}</div></section></div></section>`}

    function dashboardPage(){const u=currentUser()||data.users[0],up=data.competitions.find(c=>c.status==="Upcoming")||data.competitions[0];return `<section class="page compact"><div class="dashboard-top"><div><div class="eyebrow">STUDENT WORKSPACE</div><h1 class="h2" style="margin:9px 0 3px">Welcome back, ${esc(u.name.split(" ")[0])}.</h1><div class="smalltext">Your next good idea could start with one more problem.</div></div><button class="button primary" data-route="arena/${up.id}">Continue coding ↗</button></div><div class="grid g4">${statCard("Global rank",`#${u.rank}`,"↑ 12 places this week","chart")}${statCard("Country rank",`#${Math.max(1,u.rank-3)}`,"Top 5% in your region","users")}${statCard("Total score",Number(u.score).toLocaleString(),"+320 this month","award")}${statCard("Problems solved",u.solved,"8 this week","code")}</div><div class="grid g2 section" style="margin-top:19px"><div class="card"><div class="between"><div><h3 class="panel-title">Your performance</h3><div class="micro">Submission activity · last 7 days</div></div><span class="pill green">+18.4%</span></div>${chartSvg()}</div><div class="card"><div class="between"><div><h3 class="panel-title">Upcoming competition</h3><div class="micro">A new round is waiting for you.</div></div><span class="pill blue">${up.difficulty}</span></div><h2 class="h3" style="margin-top:22px">${esc(up.name)}</h2><p class="smalltext">${fmtDate(up.start,{month:"long",day:"numeric",year:"numeric"})} · ${up.duration} min · ${up.problems} problems</p><div class="divider"></div><div class="between"><span class="smalltext">${Number(up.participants).toLocaleString()} participants registered</span><button class="button secondary small" data-route="competition/${up.id}">View details</button></div></div></div><div class="grid g2 section" style="margin-top:19px"><div class="card"><div class="between"><h3 class="panel-title">Recent activity</h3><button class="button ghost small" data-route="submissions">All submissions →</button></div>${data.submissions.filter(s=>s.userId===u.id).slice(0,4).map(s=>{const p=getProblem(s.problemId);return `<div class="between" style="padding:13px 0;border-bottom:1px solid var(--line)"><div><strong style="font-size:12px">${esc(p.title)}</strong><div class="micro">${esc(s.language)} · ${fmtDate(s.date)}</div></div><span class="badge ${s.status.toLowerCase().replaceAll(" ","-")}">${esc(s.status)}</span></div>`}).join("")||`<p class="smalltext">Start with a practice problem in the coding arena.</p>`}</div><div class="card"><div class="between"><h3 class="panel-title">Achievements</h3><button class="button ghost small" data-route="achievements">View all →</button></div><div class="grid" style="margin-top:14px">${data.achievements.filter(a=>a.earned).slice(0,3).map(achievementCard).join("")}</div><div class="divider"></div><div class="between"><div><span class="label">PROFILE COMPLETION</span><strong>82%</strong></div><button class="button secondary small" data-route="profile">Improve profile</button></div><div class="progress" style="margin-top:10px"><i style="--w:82%"></i></div></div></div><div class="section"><div class="section-head"><div><div class="eyebrow">PICK UP A NEW SKILL</div><h2 class="h2" style="margin-top:9px">Recommended for you</h2></div><button class="button secondary" data-route="competitions">Browse all</button></div><div class="competition-grid">${data.competitions.slice(1,4).map(compCard).join("")}</div></div></section>`}
    function authPage(mode){if(mode==="login")return `<section class="page"><div class="wrap"><div class="auth-wrap"><div class="auth-art"><div><span class="brand-mark" style="width:50px;height:50px">${logoSvg}</span><div class="eyebrow" style="margin-top:28px">YOUR NEXT ROUND</div><h2 class="h2" style="margin-top:12px">Pick up where you left off.</h2></div><p class="smalltext auth-quote">“Every solved problem is proof of progress.”</p></div><form class="auth-form" id="login-form"><div class="eyebrow">WELCOME BACK</div><h2 class="h2" style="margin:11px 0 22px">Sign in to IDC.</h2><div class="field"><label class="label" for="login-id">Email or username</label><input class="input" id="login-id" name="identity" required autocomplete="username" placeholder="you@example.com"></div><div class="field"><label class="label" for="login-pass">Password</label><input class="input" id="login-pass" name="password" required type="password" autocomplete="current-password" placeholder="Your password"></div><div class="between" style="margin:13px 0 19px"><label class="checkbox-row"><input type="checkbox" name="remember" checked> Remember me</label><a class="smalltext" href="#/forgot">Forgot password?</a></div><button class="button primary wide" type="submit">Sign in</button><div class="divider"></div><div class="demo-notice">DEMO ACCOUNT ACCESS<br>Student: student@idiofyiscoder.com / student123<br>Admin: admin@idiofyiscoder.com / admin123</div><p class="auth-footer">New to IDIOFYISCODER? <a href="#/register">Create a free account</a></p><p class="micro">Demo authentication only; do not use a real password. No connected Google or GitHub sign-in.</p></form></div></div></section>`;
      if(mode==="register")return `<section class="page"><div class="wrap"><div class="auth-wrap"><div class="auth-art"><div><span class="brand-mark" style="width:50px;height:50px">${logoSvg}</span><div class="eyebrow" style="margin-top:28px">GLOBAL CODING COMMUNITY</div><h2 class="h2" style="margin-top:12px">Make your work count.</h2></div><p class="smalltext auth-quote">One profile. A world of challenges. Your own path forward.</p></div><form class="auth-form" id="register-form"><div class="eyebrow">JOIN IDIOFYISCODER</div><h2 class="h2" style="margin:11px 0 20px">Create your profile.</h2><div class="form-grid"><div class="field"><label class="label">Full name *</label><input class="input" name="name" required minlength="2" placeholder="Alex Morgan"></div><div class="field"><label class="label">Username *</label><input class="input" name="username" required pattern="[A-Za-z0-9_]{3,20}" placeholder="alex_codes"></div><div class="field"><label class="label">Email *</label><input class="input" name="email" required type="email" placeholder="you@example.com"></div><div class="field"><label class="label">Country *</label><select class="select" name="country" required><option value="">Select country</option>${countries.map(c=>`<option>${c}</option>`).join("")}</select></div><div class="field"><label class="label">Password *</label><input class="input" id="reg-pass" name="password" required type="password" minlength="8" placeholder="At least 8 characters"><div class="password-meter"><i id="password-meter"></i></div></div><div class="field"><label class="label">Confirm password *</label><input class="input" name="confirm" required type="password" minlength="8"></div><div class="field"><label class="label">City</label><input class="input" name="city" placeholder="Your city"></div><div class="field"><label class="label">School / university</label><input class="input" name="school" placeholder="Your institution"></div><div class="field"><label class="label">Date of birth</label><input class="input" name="birth" type="date"></div><div class="field"><label class="label">Coding experience</label><select class="select" name="experience"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option><option>Expert</option></select></div><div class="field full"><label class="label">Programming languages</label><div class="tag-list">${LANGS.map((l,i)=>`<label class="pill" style="cursor:pointer"><input type="checkbox" name="languages" value="${l}" ${i===1||i===4?"checked":""} style="accent-color:var(--blue)"> ${l}</label>`).join("")}</div></div><div class="field full"><label class="label">Profile photo (optional)</label><input class="input" type="file" name="photo" accept="image/*"></div><div class="field full"><label class="label">Short bio</label><textarea class="textarea" name="bio" maxlength="240" placeholder="What are you curious about building?"></textarea></div><div class="field full"><label class="checkbox-row"><input type="checkbox" name="terms" required><span>I agree to the <a href="#/about">Terms and Code of Conduct</a>.</span></label></div><div class="field full"><button class="button primary wide" type="submit">Create my IDIOFYISCODER account</button><p class="micro">Demo account only. Do not enter a password you use elsewhere.</p><p class="auth-footer">Already a member? <a href="#/login">Sign in</a></p></div></div></form></div></div></section>`;
      return `<section class="page"><div class="wrap"><div class="auth-wrap" style="max-width:680px"><form class="auth-form" id="forgot-form"><div class="eyebrow">ACCOUNT HELP</div><h2 class="h2" style="margin:11px 0">Reset your demo password.</h2><p class="smalltext">This standalone demo does not send email. We’ll confirm the request on this device.</p><div class="field" style="margin-top:20px"><label class="label">Account email</label><input class="input" type="email" name="email" required></div><button class="button primary" type="submit">Request reset link</button><p class="auth-footer"><a href="#/login">← Back to sign in</a></p></form></div></div></section>`}
    function arenaPage(problemId){const p=getProblem(problemId||data.lastProblem||"p1");const templates={"Python":"def solve():\n    # Write your solution here\n    pass\n\nif __name__ == \"__main__\":\n    solve()","C++":"#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","Java":"public class Main {\n    public static void main(String[] args) {\n        // Write your solution here\n    }\n}","JavaScript":"function solve(input) {\n  // Write your solution here\n}\n\nconsole.log(solve(require('fs').readFileSync(0, 'utf8')));","TypeScript":"function solve(input: string): string {\n  // Write your solution here\n  return \"\";\n}","C":"#include <stdio.h>\n\nint main(void) {\n    // Write your solution here\n    return 0;\n}"};const code=data.codeByProblem[p.id]?.[appState.language]||templates[appState.language]||`// ${appState.language} starter template\n// Write your solution here\n`;return `<section class="page compact"><div class="wrap">${pageTitle("CODING ARENA",esc(p.title),`Problem ${p.id.toUpperCase()} · ${p.points} points · ${p.timeLimit} sec · ${p.memoryLimit} MB`,`<button class="button secondary" data-route="submissions">Submission history</button>`)}<div class="demo-notice" style="margin:0 0 14px">DEMO JUDGE — Your code is not executed. Run and submit simulate evaluation results. A production contest requires an isolated server-side judge.</div><div class="arena"><aside class="card arena-panel arena-list"><div class="between"><h3 class="panel-title">Problems</h3><span class="pill">${data.problems.length}</span></div><div class="problem-list">${data.problems.map(pr=>`<button class="problem-item ${pr.id===p.id?"active":""}" data-route="problem/${pr.id}"><strong>${esc(pr.title)}</strong><small>${pr.difficulty} · ${pr.points} pts</small></button>`).join("")}</div></aside><article class="card arena-panel arena-statement"><div class="between"><span class="badge ${p.difficulty.toLowerCase()}">${p.difficulty}</span><span class="micro">${p.timeLimit}s · ${p.memoryLimit} MB</span></div><h2>${esc(p.title)}</h2><div class="prose"><p>${esc(p.description)}</p><h3>Input</h3><p>${esc(p.input)}</p><h3>Output</h3><p>${esc(p.output)}</p><h3>Constraints</h3><div class="example">${esc(p.constraints)}</div>${p.examples.map((e,i)=>`<h3>Example ${i+1}</h3><div class="example">Input: ${esc(e.input)}\nOutput: ${esc(e.output)}\nExplanation: ${esc(e.explanation)}</div>`).join("")}<h3>Hints</h3><ol>${p.hints.map(h=>`<li>${esc(h)}</li>`).join("")}</ol></div></article><section class="card arena-panel arena-editor"><div class="editor-top"><div class="row"><label class="label" for="language-select" style="margin:0">Language</label><select class="select" id="language-select" style="width:auto">${LANGS.map(l=>`<option ${appState.language===l?"selected":""}>${l}</option>`).join("")}</select></div><button class="button ghost small" data-action="fullscreen">⛶</button></div><textarea id="code-editor" class="editor" spellcheck="false" aria-label="Code editor">${esc(code)}</textarea><div class="arena-actions"><button class="button secondary small" data-action="run-code">${icon("code",14)} Run code</button><button class="button primary small" data-action="submit-code">Submit</button><button class="button ghost small" data-action="reset-code">Reset</button></div><div class="label">CONSOLE / TEST RESULTS</div><div class="console" id="console-output" aria-live="polite">Ready. Choose “Run code” for a simulated demo result.\nNo code is executed in this browser.</div></section></div></div></section>`}
    function problemPage(id){const p=getProblem(id);return `<section class="page"><div class="wrap">${pageTitle("PROBLEM LIBRARY",esc(p.title),`Problem ${p.id.toUpperCase()} · ${p.difficulty} · ${p.points} points`)}<div class="grid g2"><article class="card"><h3 class="panel-title">Problem statement</h3><p class="prose">${esc(p.description)}</p><h3 class="panel-title" style="margin-top:24px">Example input</h3><div class="example">${esc(p.examples[0].input)}</div><h3 class="panel-title" style="margin-top:17px">Example output</h3><div class="example">${esc(p.examples[0].output)}</div><button class="button primary" style="margin-top:20px" data-route="arena/${p.id}">Solve in arena ↗</button></article><div class="card"><h3 class="panel-title">Problem details</h3><div class="divider"></div><p class="smalltext"><strong>Input:</strong> ${esc(p.input)}</p><p class="smalltext"><strong>Output:</strong> ${esc(p.output)}</p><p class="smalltext"><strong>Constraints:</strong><br>${esc(p.constraints).replaceAll("\\n","<br>")}</p><span class="pill blue">${p.testCases} sample tests</span></div></div></div></section>`}
    function submissionsPage(){const u=currentUser()||data.users[0];const rows=data.submissions.filter(s=>u.role==="admin"||s.userId===u.id).slice().reverse().map(s=>{const p=getProblem(s.problemId),usr=getUser(s.userId);return `<tr><td><button class="button ghost small" data-action="submission-detail" data-id="${s.id}">${esc(s.id)}</button></td><td><strong>${esc(p.title)}</strong><div class="micro">${esc(usr.name)}</div></td><td>${esc(s.language)}</td><td><span class="badge ${s.status.toLowerCase().replaceAll(" ","-")}">${esc(s.status)}</span></td><td>${s.score}</td><td>${esc(s.time)}</td><td>${fmtDate(s.date,{month:"short",day:"numeric"})}</td></tr>`});return `<section class="page">${pageTitle("YOUR HISTORY","Submission history","Track every attempt and see how your solutions have improved.")}${tableHtml(["Submission ID","Problem","Language","Status","Score","Time","Date"],rows)}</section>`}
    function certificatesPage(){const u=currentUser()||data.users[0],list=data.certificates.filter(c=>c.userId===u.id||u.role==="admin");return `<section class="page">${pageTitle("ACHIEVEMENTS","My certificates","Verified records of the work you have completed.",`<button class="button secondary" data-route="verify">Verify a certificate</button>`)}${list.length?`<div class="grid g3">${list.map(c=>`<article class="card hoverable"><div class="between"><span class="brand-mark">${logoSvg}</span><span class="pill green">VERIFIED</span></div><div class="eyebrow" style="margin-top:23px">CERTIFICATE OF ACHIEVEMENT</div><h3 class="h3" style="margin-top:8px">${esc(c.achievement)}</h3><p class="smalltext">${esc(c.competition)}</p><div class="divider"></div><div class="between"><span class="micro">${esc(c.id)}</span><button class="button secondary small" data-action="certificate-detail" data-id="${esc(c.id)}">View certificate</button></div></article>`).join("")}</div>`:`<div class="empty"><div class="empty-mark">◇</div><h3>No certificates yet</h3><p>Complete a competition to earn your first certificate.</p><button class="button secondary" data-route="competitions">Explore competitions</button></div>`}</section>`}
    function achievementsPage(){return `<section class="page">${pageTitle("MILESTONES","Achievements","Every badge marks a step forward.")}<div class="grid g3">${data.achievements.map(a=>`<div class="achievement" style="${a.earned?"":"opacity:.48;filter:saturate(.3)"}"><div class="achievement-icon">${esc(a.icon)}</div><div><div class="between"><strong style="font-size:12px">${esc(a.name)}</strong>${a.earned?`<span class="pill green">EARNED</span>`:`<span class="pill">LOCKED</span>`}</div><div class="micro">${esc(a.description)}</div></div></div>`).join("")}</div></section>`}

      if(route==="admin/users"){const rows=data.users.map(u=>`<tr><td><div class="person">${avatar(u)}<span><span class="person-name">${esc(u.name)}</span><br><span class="person-handle">${esc(u.email)}</span></span></div></td><td>${FLAGS[u.country]} ${esc(u.country)}</td><td>${esc(u.role)}</td><td><span class="pill ${u.status==="Active"?"green":"red"}">${esc(u.status)}</span></td><td>${fmtDate(u.joinDate,{month:"short",year:"numeric"})}</td><td>#${u.rank}</td><td><button class="button secondary small" data-action="toggle-user" data-id="${u.id}">${u.status==="Active"?"Suspend":"Activate"}</button></td></tr>`);return `<section class="page compact">${pageTitle("COMMUNITY","User management","Review demo student accounts and platform roles.")}${tableHtml(["Student","Country","Role","Status","Joined","Rank","Action"],rows)}</section>`}

      if(route==="admin/leaderboard")return `<section class="page compact">${pageTitle("RANKING CONTROL","Leaderboard management","Sample ranks are generated from the seeded demonstration scores.")}<div class="demo-notice" style="margin-bottom:15px">Rankings in this preview are illustrative only. A real competition platform should derive ranks from verified judge results.</div>${leaderboardTable()}</section>`;
      if(route==="admin/certificates")return `<section class="page compact">${pageTitle("CREDENTIALS","Certificate management","Sample certificates available for verification.")}<div class="grid g3">${data.certificates.map(c=>`<article class="card soft"><div class="between"><span class="pill green">VALID</span><button class="button ghost small" data-action="certificate-detail" data-id="${esc(c.id)}">View</button></div><h3 class="h3" style="margin-top:13px">${esc(getUser(c.userId).name)}</h3><div class="smalltext">${esc(c.achievement)}</div><div class="micro" style="margin-top:9px">${esc(c.id)} · ${fmtDate(c.date)}</div></article>`).join("")}</div></section>`;
      if(route==="admin/announcements")return `<section class="page compact">${pageTitle("PLATFORM UPDATES","Announcements","Publish a message for students in this local demo.",`<button class="button primary" data-action="new-announcement">＋ New announcement</button>`)}<div class="grid">${data.announcements.map(a=>`<article class="card soft"><div class="between"><div><div class="micro">${fmtDate(a.date)}</div><h3 class="h3" style="margin-top:8px">${esc(a.title)}</h3><p class="smalltext">${esc(a.message)}</p></div><button class="button danger small" data-action="delete-announcement" data-id="${a.id}">Delete</button></div></article>`).join("")}</div></section>`;
